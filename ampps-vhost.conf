# Конфигурация виртуального хоста для AMPPS
# Добавьте это в: C:\Program Files (x86)\Ampps\apache\conf\extra\httpd-vhosts.conf

<VirtualHost *:80>
    ServerName fa-main.local
    # Или используйте ваш локальный IP для доступа из сети:
    # ServerName 192.168.1.100
    
    # Путь к проекту (ИЗМЕНИТЕ ЕСЛИ НУЖНО!)
    DocumentRoot "C:/Users/Rebys/OneDrive/Рабочий стол/Папки/fuf/fa-main"
    
    <Directory "C:/Users/Rebys/OneDrive/Рабочий стол/Папки/fuf/fa-main">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # CORS заголовки для работы с моделями и JSON
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header set Access-Control-Allow-Headers "*"
    </Directory>
    
    # Логи (опционально)
    ErrorLog "C:/Program Files (x86)/Ampps/apache/logs/fa-main-error.log"
    CustomLog "C:/Program Files (x86)/Ampps/apache/logs/fa-main-access.log" common
</VirtualHost>

# Альтернативный вариант: если хотите использовать localhost напрямую
# Просто скопируйте папку проекта в C:\Program Files (x86)\Ampps\www\fa-main
# И откройте: http://localhost/fa-main/index.html
