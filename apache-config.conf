# Конфигурация виртуального хоста Apache для 3D проекта
# Скопируйте этот файл в папку конфигурации Apache и настройте пути

# Для XAMPP: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Для WAMP: C:\wamp64\bin\apache\apache2.4.x\conf\extra\httpd-vhosts.conf
# Для отдельного Apache: C:\Apache24\conf\extra\httpd-vhosts.conf

<VirtualHost *:80>
    # Укажите ваш локальный IP или домен
    ServerName localhost
    # Или используйте: ServerName 192.168.1.100 (ваш локальный IP)
    
    # Путь к папке проекта (ИЗМЕНИТЕ НА СВОЙ ПУТЬ!)
    DocumentRoot "C:/Users/Rebys/OneDrive/Рабочий стол/Папки/fuf/fa-main"
    
    # Альтернативный путь (раскомментируйте и укажите свой):
    # DocumentRoot "C:/path/to/your/project/fa-main"
    
    <Directory "C:/Users/Rebys/OneDrive/Рабочий стол/Папки/fuf/fa-main">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        
        # CORS заголовки
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header set Access-Control-Allow-Headers "*"
    </Directory>
    
    # Логи (опционально)
    ErrorLog "logs/fa-main-error.log"
    CustomLog "logs/fa-main-access.log" common
</VirtualHost>

